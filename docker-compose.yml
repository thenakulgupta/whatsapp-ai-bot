# docker-compose.yml
version: "3.9"

services:
  whatsapp-ai-bot:
    container_name: whatsapp-ai-bot
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3003:3003"

    env_file:
      - .env

    environment:
      MONGODB_DATABASE: whatsapp_ai_bot
      WHATSAPP_PHONE_NUMBER_ID: 105186499120173
      WHATSAPP_BUSINESS_ACCOUNT_ID: 105030139136328
      DASHBOARD_URL: https://whatsapp-ai-bot-projects.stackmind.tech
      BACKEND_PORT: 3003
      VITE_BACKEND_URL: https://whatsapp-ai-bot-backend-projects.stackmind.tech
      NODE_ENV: development
      CURRENT_ENV: production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      SESSION_EXPIRY_HOURS: 24
      MAX_SESSION_CONTEXT_SIZE: 1000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 10000
      LOG_LEVEL: info
      LOG_FILE: logs/app.log
      GROQ_MODEL: llama-3.1-8b-instant

    restart: unless-stopped

    volumes:
      - logs_data:/app/logs

volumes:
  logs_data: